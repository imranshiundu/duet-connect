name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rsync openssh-client python3-pip

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest flake8 black

      - name: Install Duet Connect package
        run: python3 -m pip install -e .

      - name: Run test suite
        run: python3 -m pytest tests/ -v

      - name: Lint with flake8
        run: flake8 duetconnect tests --max-line-length=100

      - name: Check formatting with black
        run: black --check duetconnect tests --line-length=100
